# Автодеплой на хостинг Timeweb по FTP: каждый push в main выкладывает сайт в папку сайта на хостинге.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   FTP_SERVER    — адрес FTP-сервера из панели Timeweb (например, vh123.timeweb.ru)
#   FTP_USERNAME  — логин аккаунта Timeweb
#   FTP_PASSWORD  — пароль от FTP / аккаунта
#   FTP_DIR       — папка сайта на хостинге, со слэшем в конце (например, aidakate/public_html/)
name: Deploy to Timeweb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-timeweb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            README.md
