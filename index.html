<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aida & Kate</title>
  <style>
    :root { --bg: #faf7f2; --fg: #2b2b2b; --muted: #7a7a7a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #f2f2f2; --muted: #9a9a9a; } }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 600; letter-spacing: -0.02em; }
    p { margin-top: 12px; color: var(--muted); font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Aida &amp; Kate</h1>
    <p>Сайт скоро будет готов</p>
  </main>
</body>
</html>
